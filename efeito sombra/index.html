<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Blur</title>
    <style>
        body{
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        } 
        
        .codigo{
            display: flex;
            gap: 20px;
        }

        .codigo span{
            color: white;
            font-size: 80px;
            filter: blur(20px);
            transition: 0.3s;
        }

        .codigo span:hover{
            filter: blur(00);
        }

        .codigo span:hover + span{
            filter: blur(2px);
        }
    </style>
</head>
<body>
    <div class="codigo">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Efeito Blur</title>
    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background: black;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        } 
        
        .codigo{
            display: flex;
            gap: 20px;
        }

        .codigo span{
            color: white;
            font-size: clamp(45px, 80px, 80px);
            filter: blur(20px);
            transition: 0.3s;
            font-family: Arial, Helvetica, sans-serif;
        }

        /*numero em foco*/
        .codigo span:hover,
        .codigo span:active{
            filter: blur(00);
            transform: scale(1.08);
        }

        /* numero da direita*/
        .codigo span:hover + span{
            filter: blur(6px);
        }

         /* segundo numero da direita*/
        .codigo span:hover + span + span{
            filter: blur(10px);
        }

         /* numero da esquerda*/
        .codigo span:has( + span:hover){
            filter: blur(6px);
        }

         /* segundo numero da esquerda*/
        .codigo span:has( + span +span:hover){
            filter: blur(6px);
        }

    </style>
</head>
<body>
    <div class="codigo">
        <span>1</span>
        <span>2</span>
        <span>3</span>
        <span>4</span>
        <span>5</span>
        <span>6</span>
        <span>7</span>
        <span>8</span>
        <span>9</span>
    </div>
</body>
</html>
